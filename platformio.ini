; TWANG Next - PlatformIO build (alternative to the Arduino IDE)
; Uses the pioarduino platform, which ships the ESP32 Arduino core 3.x.
[platformio]
src_dir = TWANG32
default_envs = twang32

[env:twang32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = nodemcu-32s
framework = arduino
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  fastled/FastLED@^3.10.0
  ESP32Async/ESPAsyncWebServer@^3.7.0
  ESP32Async/AsyncTCP@^3.4.0

; Flash over Wi-Fi after the first USB upload: pio run -e twang32-ota -t upload
[env:twang32-ota]
extends = env:twang32
upload_protocol = espota
upload_port = twang.local
